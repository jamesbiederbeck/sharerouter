name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.1"

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: echo "$RELEASE_KEYSTORE_B64" | base64 -d > debug.keystore

      - name: Build APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.1"
          export PATH="$BUILD_TOOLS:$PATH"
          make \
            ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar" \
            AAPT2="$BUILD_TOOLS/aapt2"

      - uses: actions/upload-artifact@v4
        with:
          name: sharerouter-apk
          path: aligned.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aligned.apk
